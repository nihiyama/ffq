version: "3"

tasks:

  test:
    desc: run go test
    dir: "{{.ROOT_DIR}}"
    cmds:
      - go test -v -shuffle=on -race -timeout 20s -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
      - go tool cover -html=coverage.out -o coverage.html
    silent: true

  bench:
    desc: run go benchmark against the current checkout
    dir: "{{.ROOT_DIR}}/bench"
    cmds:
      - go list -m github.com/nihiyama/ffq
      - go test -benchmem -run=^$ -bench ^Benchmark .
    silent: true

  bench-cpu:
    desc: run go benchmark
    dir: "{{.ROOT_DIR}}/bench"
    cmds:
      - go test -benchmem -cpuprofile profile.out -run=^$ -bench ^Benchmark github.com/nihiyama/ffq
      - go tool pprof -http=:8080 profile.out
    silent: true
